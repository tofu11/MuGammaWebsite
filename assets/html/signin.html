<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Theta Tau</title>
    <link rel="stylesheet" href="main.css">
    <style>
        body {
            font-family: 'Source Sans Pro', sans-serif;
            background-color: #f4e3b2;
            margin: 0;
            padding: 0;
        }

        .signin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #590016;
        }

        .signin-box {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }

        .signin-box h2 {
            margin-bottom: 20px;
            color: #590016;
        }

        /* Center form and inputs */
        .signin-box form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .signin-box input {
            width: 100%;
            max-width: 250px;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .signin-box button {
            width: 100%;
            max-width: 250px;
            background-color: #590016;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .signin-box button:hover {
            background-color: #7a0023;
        }

        .signin-box a {
            display: block;
            margin-top: 10px;
            color: #590016;
            text-decoration: none;
        }

        .signin-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="signin-container">
        <div class="signin-box">
            <h2>Sign In / <br> Create an Account</h2>
            <form action="login_handler.php" method="POST">
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
            <a href="index.html">Go Home</a>
        </div>
    </div>
</body>

</html>
